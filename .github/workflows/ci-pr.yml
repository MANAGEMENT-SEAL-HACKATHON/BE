name: BE PR CI

on:
  pull_request:
    branches: [dev, master, main]
  push:
    branches: [dev]

jobs:
  fast-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      - name: Fast PR — services / guards / query
        run: mvn -B test -Dtest="*ServiceTest,*GuardTest,*QueryServiceTest,*StudentAccess*"

  integration:
    runs-on: ubuntu-latest
    needs: [fast-unit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      - name: Integration tests
        run: mvn -B test -Dtest="*IntegrationTest"

  security-portal:
    runs-on: ubuntu-latest
    needs: [fast-unit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      - name: Security / portal / teams
        run: mvn -B test -Dtest="*StudentPortal*,*Event*,*GuestJudge*,*TeamService*,*TeamMembership*,*ExportCsv*"

  full-verify:
    runs-on: ubuntu-latest
    needs: [fast-unit, integration, security-portal]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      - name: Full verify (unit + integration + ArchUnit)
        run: mvn -B verify
