# MinIO — Hackathon BE (API :19000, console :19001, bucket seal-submissions)
# docker compose -p seal-hackathon-minio -f docker-compose.minio.yml up -d

name: seal-hackathon-minio

services:
  minio:
    image: minio/minio:latest
    container_name: seal-hackathon-minio
    ports:
      - "19000:9000"
      - "19001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - seal_hackathon_minio_data:/data

  minio-init:
    image: minio/mc:latest
    container_name: seal-hackathon-minio-init
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 2 &&
      mc alias set seal http://minio:9000 minioadmin minioadmin &&
      mc mb seal/seal-submissions --ignore-existing &&
      echo 'Bucket seal-submissions ready'
      "

volumes:
  seal_hackathon_minio_data:
    name: seal_hackathon_minio_data
