# MinIO riêng cho SEAL Hackathon BE — slide PDF + ảnh thẻ sinh viên.
# Data lưu volume seal_hackathon_minio_data — giữ file khi restart container; mất khi docker volume rm.
# Tránh trùng port 9000/9001 với dự án khác (vd. timelens).
#
# Console: http://localhost:19001  (user/pass: minioadmin / minioadmin)
# API S3:  http://localhost:19000
# Bucket:   seal-submissions
#
# Chạy:
#   docker compose -f docker-compose.minio.yml up -d
#
# App (.env):
#   APP_STORAGE_TYPE=minio
#   APP_STORAGE_MINIO_ENDPOINT=http://localhost:19000
#   APP_STORAGE_MINIO_BUCKET=seal-submissions

services:
  minio:
    image: minio/minio:latest
    container_name: seal-hackathon-minio
    ports:
      - "19000:9000"
      - "19001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - seal_hackathon_minio_data:/data

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 2 &&
      mc alias set seal http://minio:9000 minioadmin minioadmin &&
      mc mb seal/seal-submissions --ignore-existing &&
      echo 'Bucket seal-submissions ready'
      "

volumes:
  seal_hackathon_minio_data:
