# Dev profile — giá trị nhạy cảm lấy từ .env (DotenvEnvironment) hoặc biến môi trường OS.
# Copy .env.example → .env và chỉnh trước khi chạy.

spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

security.jwt.enabled=${SECURITY_JWT_ENABLED:true}
security.jwt.secret=${SECURITY_JWT_SECRET:}
security.jwt.issuer=${SECURITY_JWT_ISSUER:seal-hackathon-api}
security.jwt.access-ttl-minutes=${SECURITY_JWT_ACCESS_TTL_MINUTES:30}
security.jwt.refresh-ttl-days=${SECURITY_JWT_REFRESH_TTL_DAYS:7}
security.jwt.email-verify-ttl-hours=${SECURITY_JWT_EMAIL_VERIFY_TTL_HOURS:24}
security.jwt.dev-expose-verify-token=${SECURITY_JWT_DEV_EXPOSE_VERIFY_TOKEN:true}
security.jwt.password-reset-ttl-hours=${SECURITY_JWT_PASSWORD_RESET_TTL_HOURS:1}
security.jwt.dev-expose-password-reset-token=${SECURITY_JWT_DEV_EXPOSE_PASSWORD_RESET_TOKEN:true}
security.oauth.google-client-id=${SECURITY_OAUTH_GOOGLE_CLIENT_ID:}
security.oauth.google-token-info-url=${SECURITY_OAUTH_GOOGLE_TOKEN_INFO_URL:https://oauth2.googleapis.com/tokeninfo}
security.oauth.github-api-base-url=${SECURITY_OAUTH_GITHUB_API_BASE_URL:https://api.github.com}
security.oauth.github-client-id=${SECURITY_OAUTH_GITHUB_CLIENT_ID:}
security.oauth.github-client-secret=${SECURITY_OAUTH_GITHUB_CLIENT_SECRET:}
security.oauth.github-token-url=${SECURITY_OAUTH_GITHUB_TOKEN_URL:https://github.com/login/oauth/access_token}
security.oauth.auto-link-by-email=${SECURITY_OAUTH_AUTO_LINK_BY_EMAIL:true}
security.oauth.auto-create-user-on-login=${SECURITY_OAUTH_AUTO_CREATE_USER_ON_LOGIN:true}
security.oauth.require-password-for-auto-link=${SECURITY_OAUTH_REQUIRE_PASSWORD_FOR_AUTO_LINK:false}
security.oauth.allow-link-different-email=${SECURITY_OAUTH_ALLOW_LINK_DIFFERENT_EMAIL:false}

app.frontend-url=${APP_FRONTEND_URL:http://localhost:5173}
