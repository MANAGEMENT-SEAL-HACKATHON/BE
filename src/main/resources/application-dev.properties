spring.jpa.hibernate.ddl-auto=create-drop

spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

security.jwt.enabled=${SECURITY_JWT_ENABLED:true}
security.jwt.secret=${SECURITY_JWT_SECRET:}
security.jwt.issuer=${SECURITY_JWT_ISSUER:seal-hackathon-api}
security.jwt.access-ttl-minutes=${SECURITY_JWT_ACCESS_TTL_MINUTES:30}
security.jwt.refresh-ttl-days=${SECURITY_JWT_REFRESH_TTL_DAYS:7}
security.jwt.password-reset-ttl-hours=${SECURITY_JWT_PASSWORD_RESET_TTL_HOURS:1}
security.jwt.dev-expose-password-reset-token=${SECURITY_JWT_DEV_EXPOSE_PASSWORD_RESET_TOKEN:true}
security.oauth.google-client-id=${SECURITY_OAUTH_GOOGLE_CLIENT_ID:}
security.oauth.google-token-info-url=${SECURITY_OAUTH_GOOGLE_TOKEN_INFO_URL:https://oauth2.googleapis.com/tokeninfo}
security.oauth.github-api-base-url=${SECURITY_OAUTH_GITHUB_API_BASE_URL:https://api.github.com}
security.oauth.github-client-id=${SECURITY_OAUTH_GITHUB_CLIENT_ID:}
security.oauth.github-client-secret=${SECURITY_OAUTH_GITHUB_CLIENT_SECRET:}
security.oauth.github-token-url=${SECURITY_OAUTH_GITHUB_TOKEN_URL:https://github.com/login/oauth/access_token}
security.oauth.auto-link-by-email=${SECURITY_OAUTH_AUTO_LINK_BY_EMAIL:true}
security.oauth.auto-create-user-on-login=${SECURITY_OAUTH_AUTO_CREATE_USER_ON_LOGIN:true}
security.oauth.require-password-for-auto-link=${SECURITY_OAUTH_REQUIRE_PASSWORD_FOR_AUTO_LINK:false}
security.oauth.allow-link-different-email=${SECURITY_OAUTH_ALLOW_LINK_DIFFERENT_EMAIL:false}

app.frontend-url=${APP_FRONTEND_URL:http://localhost:5173}

# Dev seed — E2E GĐ2→GĐ6 (docs/testing/dev-seed-guide.md)
app.seed.e2e.enabled=${APP_SEED_E2E_ENABLED:true}
app.seed.gd3.enabled=${APP_SEED_GD3_ENABLED:true}
app.seed.gd4.enabled=${APP_SEED_GD4_ENABLED:true}
app.seed.gd5.enabled=${APP_SEED_GD5_ENABLED:true}
app.seed.gd6.enabled=${APP_SEED_GD6_ENABLED:true}
# Object storage — MinIO (slide PDF + ảnh thẻ SV). Data giữ trong Docker volume seal_hackathon_minio_data.
# Console http://localhost:19001 — bucket seal-submissions
# Lưu ý: port 9000/9001 thường bị dự án khác (timelens…) chiếm — dùng 19000/19001 cho SEAL.
app.storage.type=${APP_STORAGE_TYPE:minio}
app.storage.local-dir=${APP_STORAGE_LOCAL_DIR:target/test-uploads}
app.storage.submission-slide-max-mb=${APP_STORAGE_SUBMISSION_SLIDE_MAX_MB:25}
spring.servlet.multipart.max-file-size=${SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE:25MB}
spring.servlet.multipart.max-request-size=${SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE:25MB}
app.storage.minio.endpoint=${APP_STORAGE_MINIO_ENDPOINT:http://localhost:19000}
app.storage.minio.access-key=${APP_STORAGE_MINIO_ACCESS_KEY:minioadmin}
app.storage.minio.secret-key=${APP_STORAGE_MINIO_SECRET_KEY:minioadmin}
app.storage.minio.bucket=${APP_STORAGE_MINIO_BUCKET:seal-submissions}
app.storage.minio.region=${APP_STORAGE_MINIO_REGION:us-east-1}

# GitHub repo public check (disable in tests: false)
app.submission.github-public-check-enabled=${APP_SUBMISSION_GITHUB_PUBLIC_CHECK_ENABLED:true}
