# URL Database Azure
# Thay <YOUR_SERVER_NAME> b?ng tên server c?a b?n (ví d?: seal-hackathon-db-02)
spring.datasource.url=jdbc:mysql://${DB_HOST}:3306/sealhackathon?useSSL=true&requireSSL=false&serverTimezone=UTC

# S? d?ng bi?n môi tr??ng (L?y t? App Service setting)
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}

# Driver và các config khác
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.profiles.active=prod