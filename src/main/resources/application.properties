spring.application.name=BE

# Server config
server.port=8080
server.servlet.context-path=/

# Database config (createDatabaseIfNotExist)
#spring.datasource.url=jdbc:mysql://localhost:3306/SealHackathon?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.url=jdbc:mysql://localhost:3306/SealHackathon
spring.datasource.username=root
spring.datasource.password=12345
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
#spring.jpa.properties.hibernate.format_sql=true

# JPA config — update: chỉ tạo/sửa bảng thiếu (không DROP FK mỗi lần start).
# Dùng create CHỈ KHI cần reset DB trắng 1 lần (sẽ spam WARN nếu bảng chưa tồn tại).
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Jackson 3 bridge: Spring Boot 4 ship Jackson 3 (tools.jackson.*), Hibernate 7 auto-detect
# chỉ biết Jackson 2 -> auto-discovery fail. Đăng ký custom FormatMapper Jackson 3 cho cột JSON
# (vd AuditLog.detail) để tránh "Could not find a FormatMapper for the JSON format".
spring.jpa.properties.hibernate.type.json_format_mapper=com.se194093.be.config.Jackson3JsonFormatMapper

# Activate dev profile -> kích hoạt DataInitializer (seed RICH dataset cho MF-01)
spring.profiles.active=dev