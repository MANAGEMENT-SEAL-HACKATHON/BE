spring.application.name=BE

# Timezone: set context timezone = UTC+7. Khi FE gửi "2026-06-06T00:00:00+07:00",
# Jackson adjust sang context timezone (UTC+7) → giữ nguyên "2026-06-06T00:00:00" → date = 06/06 đúng.
spring.jackson.time-zone=Asia/Ho_Chi_Minh

# Server config
server.port=8080
server.servlet.context-path=/

spring.datasource.url=jdbc:mysql://localhost:3306/SealHackathon?serverTimezone=Asia/Ho_Chi_Minh&connectionTimeZone=LOCAL
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
#spring.jpa.properties.hibernate.format_sql=true

# ddl-auto: profile dev/prod (application-dev.properties / application-prod.properties)
# show-sql: tắt để giảm nhiễu log (khó đọc log mail/lỗi + tràn file terminal). Bật lại khi cần debug SQL.
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
#spring.jpa.properties.hibernate.format_sql=true

# Jackson 3 bridge: Spring Boot 4 ship Jackson 3 (tools.jackson.*), Hibernate 7 auto-detect
spring.jpa.properties.hibernate.type.json_format_mapper=com.sealhackathon.api.config.Jackson3JsonFormatMapper

# Activate dev profile
spring.profiles.active=dev

# OpenAPI / Swagger UI (SpringDoc 3.x — Spring Boot 4)
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.packages-to-scan=com.sealhackathon.api

# MF-02 FR-13A — khóa đội sau registration_end (cron idempotent)
app.team-lock.scheduler.enabled=true
app.team-lock.scheduler.cron=0 * * * * *

# Mail (SMTP) — mặc định TẮT (NoOpEmailServiceImpl chỉ log). Bật bằng APP_MAIL_ENABLED=true
# và cấu hình spring.mail.* bên dưới (VD Gmail App Password, Mailtrap, SES SMTP).
app.mail.enabled=${APP_MAIL_ENABLED:false}
app.mail.from=${APP_MAIL_FROM:no-reply@sealhackathon.local}
app.mail.from-name=${APP_MAIL_FROM_NAME:SEAL Hackathon}

# Stakeholder broadcast email dedupe window (seconds)
app.notifications.broadcast-dedupe-seconds=${APP_NOTIFICATIONS_BROADCAST_DEDUPE_SECONDS:60}

# Max times a coordinator may extend registration deadline
app.hackathon.max-registration-extensions=${APP_HACKATHON_MAX_REGISTRATION_EXTENSIONS:2}

# Kit inventory + distribution desk (Phase 4)
app.kits.enabled=${APP_KITS_ENABLED:true}
spring.mail.host=${SPRING_MAIL_HOST:}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SPRING_MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SPRING_MAIL_SMTP_STARTTLS:true}