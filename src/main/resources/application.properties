spring.application.name=BE

# Server config
server.port=8080
server.servlet.context-path=/

spring.datasource.url=jdbc:mysql://localhost:3306/SealHackathon
spring.datasource.username=root
spring.datasource.password=12345
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
#spring.jpa.properties.hibernate.format_sql=true

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Jackson 3 bridge: Spring Boot 4 ship Jackson 3 (tools.jackson.*), Hibernate 7 auto-detect
spring.jpa.properties.hibernate.type.json_format_mapper=com.sealhackathon.api.config.Jackson3JsonFormatMapper

# Activate dev profile
spring.profiles.active=dev

# OpenAPI / Swagger UI (SpringDoc 3.x — Spring Boot 4)
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.packages-to-scan=com.sealhackathon.api