spring.application.name=BE

# Timezone: set context timezone = UTC+7. Khi FE gửi "2026-06-06T00:00:00+07:00",
# Jackson adjust sang context timezone (UTC+7) → giữ nguyên "2026-06-06T00:00:00" → date = 06/06 đúng.
spring.jackson.time-zone=Asia/Ho_Chi_Minh

# Server config
server.port=8080
server.servlet.context-path=/

spring.datasource.url=jdbc:mysql://localhost:3306/SealHackathon?serverTimezone=Asia/Ho_Chi_Minh&connectionTimeZone=LOCAL
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
#spring.jpa.properties.hibernate.format_sql=true

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
#spring.jpa.properties.hibernate.format_sql=true

# Jackson 3 bridge: Spring Boot 4 ship Jackson 3 (tools.jackson.*), Hibernate 7 auto-detect
spring.jpa.properties.hibernate.type.json_format_mapper=com.sealhackathon.api.config.Jackson3JsonFormatMapper

# Activate dev profile
spring.profiles.active=dev

# OpenAPI / Swagger UI (SpringDoc 3.x — Spring Boot 4)
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.packages-to-scan=com.sealhackathon.api

# MF-02 FR-13A — khóa đội sau registration_end (cron idempotent)
app.team-lock.scheduler.enabled=true
app.team-lock.scheduler.cron=0 * * * * *